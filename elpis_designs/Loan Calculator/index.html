<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loan Calculator by Elpis</title>
  <meta name="description" content="Calculate monthly loan repayments, total cost and interest from amount, rate and term. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#e9967a">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/ibm-plex-sans.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card">
    <h1 class="heading">Loan Calculator</h1>

    <form id="loan-form" novalidate>
      <div class="field">
        <label for="amount">Loan amount</label>
        <div class="affix">
          <span class="prefix" aria-hidden="true">$</span>
          <input type="number" id="amount" min="1" step="any" inputmode="decimal" placeholder="25000">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="interest">Interest rate</label>
          <div class="affix">
            <input type="number" id="interest" min="0" step="any" inputmode="decimal" placeholder="6.5" aria-describedby="interest-unit">
            <span class="suffix" id="interest-unit">% a year</span>
          </div>
        </div>

        <div class="field">
          <label for="years">Term</label>
          <div class="affix">
            <input type="number" id="years" min="1" max="50" step="1" inputmode="numeric" placeholder="5" aria-describedby="years-unit">
            <span class="suffix" id="years-unit">years</span>
          </div>
        </div>
      </div>

      <p id="error" class="danger-alert" role="alert" hidden></p>

      <button type="submit" id="calculate">Calculate repayments</button>
    </form>

    <section class="results" id="results" hidden aria-labelledby="results-title" aria-live="polite">
      <h2 id="results-title" class="sr-only">Results</h2>

      <p class="monthly">
        <span class="label">Monthly payment</span>
        <output id="monthly-payment" class="big"></output>
      </p>

      <div class="split" aria-hidden="true">
        <span class="split-principal" id="bar-principal"></span>
        <span class="split-interest" id="bar-interest"></span>
      </div>

      <dl class="totals">
        <div>
          <dt><span class="dot dot-principal" aria-hidden="true"></span>Amount borrowed</dt>
          <dd id="principal-out"></dd>
        </div>
        <div>
          <dt><span class="dot dot-interest" aria-hidden="true"></span>Total interest</dt>
          <dd id="total-interest"></dd>
        </div>
        <div class="total-row">
          <dt>Total you repay</dt>
          <dd id="total-payment"></dd>
        </div>
      </dl>
    </section>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
