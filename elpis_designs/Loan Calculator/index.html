<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Loan Calculator</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="Calculate loan repayments from amount, interest and years. A small vanilla JavaScript demo by Elpis.">
  <style>body{padding-top:64px!important}</style>
</head>

<body>
  <a href="/" style="position:absolute;top:12px;left:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <div class="card">

    <h1 class="heading">Loan Calculator</h1>

    <form id="loan-form">

      <div class="input-holders">
        <label for="amount">Amount</label>
        <span id="add-input">$</span>
        <input required type="number" placeholder="Loan Amount" id="amount">
      </div>

      <div class="input-holders">
        <label for="intrest">Intrest</label>
        <span id="add-input">%</span>
        <input required type="number" placeholder="Intrest" id="intrest">
      </div>

      <div class="input-holders">
        <label for="years">Years to Repay</label>
        <input required type="number" placeholder="Years" id="years">
      </div>

      <div class="">
        <input type="submit" id="calculate" value="Calculate">
      </div>

    </form>

    <div id="loading">
      <img id="image-loading" src="image/unnamed (1).gif" alt="">
    </div>

    <div class="results">

      <h1>Results</h1>

      <div class="result-holders">
        <label>Monthly Payment</label>
        <span id="add-input">$</span>
        <input type="number" id="monthly-payment" disabled>
      </div>

      <div class="result-holders">
        <label>Total Payment</label>
        <span id="add-input">$</span>
        <input type="number" id="total-payment" disabled>
      </div>

      <div class="result-holders">
        <label>Total Intrest</label>
        <span id="add-input">$</span>
        <input type="number" id="total-intrest" disabled>
      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
