<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List by Elpis</title>
  <meta name="description" content="Add, check off, filter and remove tasks saved in local storage. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#4c6180">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/manrope.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="tasks-card">
    <section class="cards-input">
      <h1>Task List</h1>

      <form id="task-form">
        <label for="new-task">New task</label>
        <div class="add-row">
          <input type="text" id="new-task" autocomplete="off" placeholder="What needs doing?">
          <button type="submit">Add task</button>
        </div>
        <p class="form-error" id="form-error" role="alert" hidden>Type a task first, then add it.</p>
      </form>
    </section>

    <section class="cards-display" aria-labelledby="tasks-title">
      <div class="list-head">
        <h2 id="tasks-title">Tasks</h2>
        <p class="summary" id="summary" aria-live="polite"></p>
      </div>

      <label class="sr-only" for="filter">Filter tasks</label>
      <input type="search" id="filter" autocomplete="off" placeholder="Filter tasks">

      <ul class="collection" id="collection"></ul>

      <p class="empty" id="empty" hidden></p>

      <div class="actions">
        <button type="button" id="clear-done" class="link-btn" hidden>Clear completed</button>
        <button type="button" id="clear-tasks" class="link-btn danger" hidden>Clear all tasks</button>
      </div>
    </section>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
