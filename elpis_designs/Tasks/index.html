<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>My Tasks</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="Add, remove and filter tasks saved in local storage. A small vanilla JavaScript demo by Elpis.">
  <style>body{padding-top:64px!important}</style>
</head>

<body>
  <a href="/" style="position:absolute;top:12px;left:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <!-- <h1>JavaScript Sandbox: Section 2</h1> -->

  <div class="tasks-card">

    <div class="cards-input">

      <h3 id="tasks-input">Task List</h3>

      <div class="card-form">

        <form id="task-form">

          <div class="new-task">

            <label for="new-task">
              New Task
            </label>

            <input type="text" name="new-task" id="new-task" autocomplete="off">

          </div>

          <input type="submit" value="Add Task">

        </form>

      </div>

    </div>

    <div class="cards-display">

      <h3 id="tasks-title">Tasks</h3>

      <div class="the-filter">

        <input type="text" name="filter" id="filter" autocomplete="off" placeholder="Filter">

      </div>

      <ul class="collection">

        <!-- <li id="mend" class="brend">
          <p>Elpis Thoughts</p>
          <i class='delete-item'>x</i>
        </li> -->

      </ul>

      <a href='#' id="clear-tasks">Clear Tasks</a>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
