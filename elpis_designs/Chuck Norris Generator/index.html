<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuck Norris Joke Generator by Elpis</title>
  <meta name="description" content="Generate Chuck Norris jokes from a local JSON API. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/anton.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card">
    <h1>Chuck Norris Joke Generator</h1>

    <form id="joke-form" novalidate>
      <label for="number">How many jokes?</label>
      <div class="row">
        <input type="number" id="number" min="1" max="20" value="3" required>
        <button type="submit" class="get-jokes">Get jokes</button>
      </div>
      <p class="hint" id="hint">Pick a number from 1 to 20.</p>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <ol class="jokes" id="jokes"></ol>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
