<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Chuck Norris Joke Generator</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="Generate Chuck Norris jokes from a local JSON API. A small vanilla JavaScript demo by Elpis.">
  <style>body{padding-top:64px!important}</style>
</head>

<body>
  <a href="/" style="position:absolute;top:12px;left:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <div class="card">

    <h1>Chuck Norris Joke Generator</h1>

    <form>
      <div>
        <label for="">Number of Jokes</label>
        <input type="number" id="number">
      </div>

      <div class="bdiv">
        <button class="get-jokes">Get Jokes</button>
      </div>
    </form>

    <div class="loader">
      <img src="gifs/unnamed.gif" alt="">
    </div>

    <ul class='jokes'></ul>

  </div>

  <script src="app.js"></script>

</body>

</html>
