<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guesser by Elpis</title>
  <meta name="description" content="Guess the hidden number in three tries. A small vanilla JavaScript game by Elpis.">
  <meta name="theme-color" content="#b258ca">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/fredoka.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card" id="game">
    <h1>Number Guesser</h1>

    <p class="prompt">I'm thinking of a number between <span class="min-num">1</span> and <span class="max-num">10</span>.</p>

    <div class="lives">
      <span class="lives-label">Guesses left</span>
      <span class="pips" id="pips" aria-hidden="true"></span>
      <span class="sr-only" id="lives-text"></span>
    </div>

    <form class="form-holder" id="guess-form" novalidate>
      <label class="sr-only" for="guess-input">Your guess</label>
      <input type="number" id="guess-input" inputmode="numeric" placeholder="Your guess" autocomplete="off">
      <button type="submit" id="guess-btn">Guess</button>
    </form>

    <p class="message" id="message" role="status" aria-live="polite"></p>

    <ul class="history" id="history" aria-label="Your guesses so far"></ul>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
