<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Guess That Number</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="A number guessing game built with vanilla JavaScript by Elpis.">
  <style>body{padding-top:64px!important}</style>
</head>

<body>
  <a href="/" style="position:absolute;top:12px;left:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <div class="card">

    <h1>Number Guesser</h1>

    <div id="game">

      <p>Guess a number between
        <span class="min-num"></span>
        and
        <span class="max-num"></span>
      </p>

      <form class="form-holder">

        <input size='1' type="number" id="guess-input" placeholder="Enter your guess">

        <input type="submit" value="Submit" id="guess-btn">

      </form>

      <p class="message"></p>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
