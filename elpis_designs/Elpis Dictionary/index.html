<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elpis Dictionary</title>
  <meta name="description" content="Search a dictionary of over 100,000 words by exact word, starting letters or containing text. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#9acd32">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/source-serif-4.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card">
    <header>
      <h1>Elpis Dictionary</h1>
      <p class="sub">Over 100,000 words with their meanings.</p>
    </header>

    <form id="search-word" role="search">
      <label class="sr-only" for="word-input">Word to look up</label>
      <div class="search-row">
        <input type="search" id="word-input" placeholder="Look up a word" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit">Search</button>
      </div>

      <fieldset class="modes">
        <legend class="sr-only">Match words that</legend>
        <input type="radio" name="mode" value="exact" id="word-only">
        <label for="word-only">Exact word</label>
        <input type="radio" name="mode" value="start" id="word-starting" checked>
        <label for="word-starting">Starts with</label>
        <input type="radio" name="mode" value="contain" id="word-inside">
        <label for="word-inside">Contains</label>
      </fieldset>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="display-meaning" class="results"></div>

    <button type="button" id="more" class="more" hidden>Show more words</button>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
