<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Elpis Dictionary</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="Search a dictionary by whole word, starting letters or containing text. A small vanilla JavaScript demo by Elpis.">
</head>

<body>
  <a href="/" style="position:fixed;left:12px;bottom:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <div class="card">

    <h1>Elpis Dictionary</h1>

    <form id="search-word">

      <input type="text" id="word-input" placeholder="Search" autocomplete="off">
      <input type="submit" value="Search">

      <div class="cho-div">

        <div class="cho-holder">
          <input type="radio" class="cho-type" name="cho-type" value="Elpis" id="word-only">
          <label for="word-only">Word Only</label>
        </div>

        <div class="cho-holder">
          <input type="radio" checked class="cho-type" name="cho-type" id="word-starting">
          <label for="word-starting">Starting Word</label>
        </div>

        <div class="cho-holder">
          <input type="radio" class="cho-type" name="cho-type" id="word-inside">
          <label for="word-inside">Words Containing</label>
        </div>

      </div>

    </form>

    <div class="loader">
      <img src="gifs/unnamed (1).gif" alt="">
    </div>

    <div id="display-meaning"></div>

  </div>

  <script src="app.js"></script>

</body>

</html>
