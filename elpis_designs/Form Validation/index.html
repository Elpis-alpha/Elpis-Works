<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation by Elpis</title>
  <meta name="description" content="A form that checks name, ZIP code, email and phone number as you fill it in. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#00ffff">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/space-grotesk.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card">
    <h1>Sign up</h1>
    <p class="sub">Each field is checked when you leave it.</p>

    <form id="signup" novalidate>
      <div class="form-x">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" aria-describedby="name-hint">
        <p class="hint" id="name-hint" data-hint="2 to 30 letters. Spaces, hyphens and apostrophes are fine.">2 to 30 letters. Spaces, hyphens and apostrophes are fine.</p>
      </div>

      <div class="form-x">
        <label for="zipcode">ZIP code</label>
        <input type="text" id="zipcode" autocomplete="postal-code" inputmode="numeric" aria-describedby="zipcode-hint">
        <p class="hint" id="zipcode-hint" data-hint="5 digits, for example 94107 or 94107-1234.">5 digits, for example 94107 or 94107-1234.</p>
      </div>

      <div class="form-x">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" aria-describedby="email-hint">
        <p class="hint" id="email-hint" data-hint="For example ada@example.com.">For example ada@example.com.</p>
      </div>

      <div class="form-x">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" autocomplete="tel" aria-describedby="phone-hint">
        <p class="hint" id="phone-hint" data-hint="A Nigerian number, for example 0803 123 4567 or +234 803 123 4567.">A Nigerian number, for example 0803 123 4567 or +234 803 123 4567.</p>
      </div>

      <button type="submit" id="submit">Sign up</button>
    </form>

    <div id="done" class="done" hidden tabindex="-1">
      <h2>Everything checks out</h2>
      <p id="done-msg"></p>
      <button type="button" id="again">Fill in the form again</button>
    </div>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
