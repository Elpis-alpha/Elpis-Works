<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Form Validation by Elpis</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="A form that validates name, zipcode, email and phone number on blur. A small vanilla JavaScript demo by Elpis.">
</head>

<body>
  <a href="/" style="position:fixed;left:12px;bottom:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <div class="card">

    <form>

      <div class="form-x">

        <label for="name">Name</label>

        <input type="text" required autocomplete="off" placeholder="Name" id="name">

        <div class="red-alert">
          Name must be between 2 and 10 characters
        </div>


      </div>

      <div class="form-x">

        <label for="zipcode">Zipcode</label>

        <input type="text" required autocomplete="off" placeholder="Zipcode" id="zipcode">

        <div class="red-alert">
          Enter a valid Zipcode
        </div>

      </div>

      <div class="form-x">

        <label for="email">Email</label>

        <input type="text" required autocomplete="off" placeholder="Email" id="email">

        <div class="red-alert">
          Enter a valid Email
        </div>

      </div>

      <div class="form-x">

        <label for="phone">Phone Number</label>

        <input type="text" required autocomplete="off" placeholder="Phone Number" id="phone">

        <div class="red-alert">
          Enter a valid Phone Number
        </div>

      </div>

      <input type="submit" value="Submit" id="submit">

    </form>

  </div>

  <script src="app.js"></script>

</body>

</html>
