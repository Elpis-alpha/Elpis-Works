<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book List by Elpis</title>
  <meta name="description" content="Add and delete books persisted to local storage. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#708090">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../../fonts/newsreader.css?v=20261111">
  <link rel="stylesheet" href="../../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card">
    <header class="card-head">
      <h1>Book List</h1>
      <p>Keep track of the books you want to read. Your list stays in this browser.</p>
    </header>

    <form id="book-form" novalidate>
      <div class="field field-wide">
        <label for="title">Title</label>
        <input autocomplete="off" type="text" id="title" placeholder="The Left Hand of Darkness">
      </div>

      <div class="field">
        <label for="author">Author</label>
        <input autocomplete="off" type="text" id="author" placeholder="Ursula K. Le Guin">
      </div>

      <div class="field">
        <label for="isbn">ISBN</label>
        <input autocomplete="off" type="text" id="isbn" inputmode="numeric" placeholder="9780441478125">
      </div>

      <button type="submit" class="submit-form">Add book</button>
    </form>

    <div id="alerts" class="alerts" role="status" aria-live="polite"></div>

    <section class="shelf" aria-labelledby="shelf-title">
      <h2 id="shelf-title">Your books <span id="book-count" class="count">0</span></h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Title</th>
              <th scope="col">Author</th>
              <th scope="col">ISBN</th>
              <th scope="col"><span class="sr-only">Remove</span></th>
            </tr>
          </thead>
          <tbody id="book-list"></tbody>
        </table>
      </div>

      <p id="empty" class="empty">No books yet. Add your first one above.</p>
    </section>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
