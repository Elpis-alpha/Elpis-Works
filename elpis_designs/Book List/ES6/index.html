<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Book List by Elpis</title>
  <link rel="icon" href="/images/Elpis/logo32.png">
  <meta name="description" content="Add and delete books persisted to local storage. A small vanilla JavaScript demo by Elpis.">
</head>

<body>
  <a href="/" style="position:fixed;left:12px;bottom:12px;z-index:9999;padding:8px 14px;font:600 14px system-ui,sans-serif;color:#eaf3fa;background:rgba(0,25,42,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">&larr; Back to Elpis Works</a>

  <div class="card">

    <h1>Add Book</h1>

    <form id="book-form">

      <div>
        <label for="title">Title</label>
        <input required autocomplete="off" type="text" id="title">
      </div>

      <div>
        <label for="author">Author</label>
        <input required autocomplete="off" type="text" id="author">
      </div>

      <div>
        <label for="isbn">ISBN</label>
        <input required autocomplete="off" type="text" id="isbn">
      </div>

      <div>
        <input type="submit" class="submit-form">
      </div>

    </form>

    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Author</th>
          <th>ISBN</th>
          <th></th>
        </tr>
      </thead>

      <tbody id="book-list">

      </tbody>
    </table>

  </div>

  <script src="app.js"></script>

</body>

</html>
