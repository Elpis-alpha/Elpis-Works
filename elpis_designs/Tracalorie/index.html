<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracalorie | Meal and Calorie Tracker by Elpis</title>
  <meta name="description" content="Track meals and calories with add, edit and delete, saved in your browser. A small vanilla JavaScript demo by Elpis.">
  <meta name="theme-color" content="#ff69b4">
  <link rel="icon" href="/images/Elpis/logo32.png">
  <link rel="stylesheet" href="../fonts/rubik.css?v=20261111">
  <link rel="stylesheet" href="../demo.css?v=20261111">
  <link rel="stylesheet" href="style.css?v=20261111">
</head>

<body>
  <a class="back-link" href="/">&larr; Back to Elpis Works</a>

  <main class="card">
    <header class="top">
      <h1>Tracalorie</h1>
      <button type="button" id="clr-all" class="ghost" hidden>Clear all</button>
    </header>

    <section class="total" aria-labelledby="total-label">
      <p id="total-label" class="total-label">Total calories today</p>
      <p class="total-num"><span id="total-calories">0</span> <span class="unit">kcal</span></p>
      <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
      <p class="meter-note" id="meter-note">of a 2,000 kcal daily guide</p>
    </section>

    <form id="meal-form" class="form" novalidate>
      <h2 id="form-title">Add a meal</h2>

      <div class="form-box-holder">
        <div class="form-box">
          <label for="item-name">Meal or food</label>
          <input type="text" autocomplete="off" placeholder="Oatmeal with banana" id="item-name">
        </div>

        <div class="form-box">
          <label for="item-calories">Calories</label>
          <input type="number" min="1" step="1" inputmode="numeric" autocomplete="off" placeholder="350" id="item-calories">
        </div>
      </div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="buttons-holder">
        <button type="submit" id="meal-add" class="primary">Add meal</button>
        <button type="submit" id="meal-update" class="primary" hidden>Save changes</button>
        <button type="button" id="meal-delete" class="danger" hidden>Delete meal</button>
        <button type="button" id="meal-back" class="ghost" hidden>Cancel</button>
      </div>
    </form>

    <ul id="item-list" class="items" aria-label="Meals"></ul>
    <p id="empty" class="empty">No meals logged yet. Add your first one above.</p>
  </main>

  <script src="app.js?v=20261111"></script>
</body>

</html>
